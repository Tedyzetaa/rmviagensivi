<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Viagens – Motta Linhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-header__title">RM Viagens</h1>
    <h2 class="site-header__subtitle">Busca de Linhas da Motta/Total</h2>
    <p class="site-header__alerta">Atenção a possíveis atrasos ou alterações de horário.</p>
    <nav class="site-nav" aria-label="Navegação principal">
      <!-- links futuros -->
    </nav>
  </header>

  <main class="main-content">
    <section class="busca" aria-labelledby="busca-label">
      <label id="busca-label" for="campo-pesquisa" class="busca__label">Busque por cidade:</label>
      <div class="busca__controls">
        <input
          id="campo-pesquisa"
          class="busca__input"
          type="search"
          placeholder="Digite o nome da cidade"
          aria-describedby="feedback-msg"
        >
        <button
          class="busca__button"
          aria-label="Iniciar busca"
        >Buscar</button>
      </div>
      <div id="spinner" class="busca__spinner" aria-hidden="true"></div>
      <p id="feedback-msg" class="busca__feedback" aria-live="polite"></p>
    </section>

    <section class="resultados" id="resultados-pesquisa" role="region" aria-live="polite">
      <ul class="resultados__list">
        <!-- resultados serão inseridos aqui -->
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2024 Diago Mendes. Todos os direitos reservados.</p>
  </footer>

  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
